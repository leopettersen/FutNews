<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutNews - Login e Cadastro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="fn-page">

    <header class="fn-header">
      <h1>FutNews</h1>
      <p>Seu portal de noticias sobre o mundo da bola</p>
    </header>

    <nav class="fn-topnav">
      <a href="index.html">Home</a>
      <a href="cadastro_itens.html" data-admin><i class="bi bi-pencil-square"></i> Cadastro</a>
      <a href="favoritos.html" data-auth><i class="bi bi-heart"></i> Favoritos</a>
      <a href="login.html" class="active" data-guest><i class="bi bi-box-arrow-in-right"></i> Login</a>
      <a href="#" data-logout><i class="bi bi-box-arrow-right"></i> Sair (<span data-username></span>)</a>
    </nav>

    <div class="fn-auth-grid">
      <!-- Tela 2: Login -->
      <section class="fn-form-card">
        <h2>Login</h2>
        <form id="form-login">
          <label for="login">Login</label>
          <input type="text" id="login" required />

          <label for="senha">Senha</label>
          <input type="password" id="senha" required />

          <button type="submit" class="fn-btn">Entrar</button>
          <p id="login-msg" class="fn-form-msg"></p>
        </form>
        <p class="fn-dica">Teste: <strong>admin / 123</strong> (administrador) ou <strong>user / 123</strong></p>
      </section>

      <!-- Tela 3: Cadastro de Usuario -->
      <section class="fn-form-card">
        <h2>Cadastrar novo usuario</h2>
        <form id="form-cadastro">
          <label for="c-login">Login</label>
          <input type="text" id="c-login" required />

          <label for="c-nome">Nome</label>
          <input type="text" id="c-nome" required />

          <label for="c-email">Email</label>
          <input type="email" id="c-email" required />

          <label for="c-senha">Senha</label>
          <input type="password" id="c-senha" required />

          <button type="submit" class="fn-btn">Cadastrar</button>
          <p id="cadastro-msg" class="fn-form-msg"></p>
        </form>
      </section>
    </div>

    <footer class="fn-footer">FutNews &mdash; Trabalho Pratico 2</footer>

  </div>

  <script src="assets/scripts/auth.js"></script>
  <script src="assets/scripts/login.js"></script>
</body>
</html>
