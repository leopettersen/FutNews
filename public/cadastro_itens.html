<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutNews - Cadastro de Itens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="fn-page">

    <header class="fn-header">
      <h1>FutNews</h1>
      <p>Painel de administracao &mdash; Cadastro de noticias</p>
    </header>

    <nav class="fn-topnav">
      <a href="index.html">Home</a>
      <a href="cadastro_itens.html" class="active" data-admin><i class="bi bi-pencil-square"></i> Cadastro</a>
      <a href="favoritos.html" data-auth><i class="bi bi-heart"></i> Favoritos</a>
      <a href="login.html" data-guest><i class="bi bi-box-arrow-in-right"></i> Login</a>
      <a href="#" data-logout><i class="bi bi-box-arrow-right"></i> Sair (<span data-username></span>)</a>
    </nav>

    <!-- Formulario de cadastro / edicao -->
    <section class="fn-form-card">
      <h2 id="form-titulo">Cadastro de Item</h2>
      <form id="form-item">
        <input type="hidden" id="item-id" />

        <label for="f-titulo">Titulo</label>
        <input type="text" id="f-titulo" required />

        <div class="fn-form-row">
          <div>
            <label for="f-tag">Tag</label>
            <input type="text" id="f-tag" placeholder="Ex.: Champions League" required />
          </div>
          <div>
            <label for="f-cat">Categoria</label>
            <select id="f-cat" required>
              <option value="brasil">Brasil</option>
              <option value="champions">Champions</option>
              <option value="transferencias">Transferencias</option>
              <option value="copa">Copa do Mundo</option>
            </select>
          </div>
        </div>

        <label for="f-imagem">Imagem (caminho)</label>
        <input type="text" id="f-imagem" placeholder="assets/images/exemplo.png" required />

        <label for="f-resumo">Resumo / Descricao</label>
        <textarea id="f-resumo" rows="4" required></textarea>

        <div class="fn-form-row">
          <div>
            <label for="f-fonte">Fonte</label>
            <input type="text" id="f-fonte" placeholder="Ex.: ESPN" required />
          </div>
          <div>
            <label for="f-data">Data</label>
            <input type="text" id="f-data" placeholder="dd/mm/aaaa" required />
          </div>
        </div>

        <label for="f-url">URL da materia original</label>
        <input type="url" id="f-url" placeholder="https://..." required />

        <div class="fn-form-actions">
          <button type="submit" class="fn-btn">Salvar</button>
          <button type="button" id="btn-limpar" class="fn-btn fn-btn-secondary">Limpar</button>
        </div>
        <p id="item-msg" class="fn-form-msg"></p>
      </form>
    </section>

    <!-- Listagem dos itens -->
    <section class="fn-secao">
      <h2 class="fn-secao-titulo">Itens cadastrados</h2>
      <div class="fn-tabela-wrap">
        <table class="fn-tabela">
          <thead>
            <tr><th>ID</th><th>Titulo</th><th>Tag</th><th>Acoes</th></tr>
          </thead>
          <tbody id="lista-itens"></tbody>
        </table>
      </div>
    </section>

    <footer class="fn-footer">FutNews &mdash; Trabalho Pratico 2</footer>

  </div>

  <script src="assets/scripts/auth.js"></script>
  <script src="assets/scripts/cadastro_itens.js"></script>
</body>
</html>
